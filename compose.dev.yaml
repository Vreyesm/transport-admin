services:
  app:
    build:
      target: development
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --webpack"
    init: true
volumes:
  node_modules:
  next_cache:
