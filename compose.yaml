services:
  app:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      WATCHPACK_POLLING: "true"
    env_file:
      - path: .env.local
        required: false
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    # Refresh dependencies when the lockfile changes, including existing volumes.
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --webpack"
    init: true

volumes:
  node_modules:
  next_cache:
